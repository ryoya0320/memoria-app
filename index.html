<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff7fa8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Memoria"><title>Memoria</title><link rel="icon" href="./icon.png"><link rel="apple-touch-icon" href="./icon.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body>
<div id="toast" class="toast"></div><header class="app-header"><button id="prevMonth">‹</button><div><small id="yearLabel"></small><h1 id="monthLabel">Memoria</h1></div><button id="nextMonth">›</button></header>
<main><section id="home" class="page active"><div class="hero card"><span>ふたりの記録</span><h2 id="coupleTitle">○○</h2><p id="daysTogether">プロフィールで記念日を設定しよう</p></div><div class="quick-grid"><button data-go="calendar" class="quick card">📅<b>カレンダー</b></button><button data-go="add" class="quick card">📷<b>思い出を追加</b></button></div><h3>最近の思い出</h3><div id="recentGrid" class="photo-grid"></div></section>
<section id="calendar" class="page"><div class="calendar-tools"><button class="outline">♡ やりたいこと</button><button class="outline">🎂 記念日</button></div><div class="weekday"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarGrid" class="calendar-grid"></div><div class="card calendar-form"><h3 id="selectedDateLabel">日付を選択</h3><input id="eventText" placeholder="予定・思い出のタイトル"><input id="eventPhoto" type="file" accept="image/*"><button id="saveEvent">この日に保存</button></div></section>
<section id="add" class="page"><div class="card form-card"><h2>思い出を追加</h2><div class="source-picker"><button id="takePhotoBtn" class="source-btn">📷<b>その場で撮る</b><small>カメラを起動</small></button><button id="choosePhotoBtn" class="source-btn">🖼️<b>写真から選ぶ</b><small>写真フォルダを開く</small></button></div><input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment"><input id="libraryInput" class="hidden" type="file" accept="image/*"><img id="photoPreview" class="preview hidden" alt="プレビュー"><label>タイトル<input id="photoTitle" maxlength="40" placeholder="例：水族館デート"></label><label>日付<input id="photoDate" type="date"></label><label>ひとこと<textarea id="photoNote" maxlength="160" placeholder="この日の思い出"></textarea></label><button id="savePhoto">アルバムに保存</button></div></section>
<section id="album" class="page"><div class="section-head"><h2>アルバム</h2><select id="albumSort"><option value="new">新しい順</option><option value="old">古い順</option></select></div><div id="albumGrid" class="photo-grid"></div></section>
<section id="profile" class="page"><div class="profile-cover" id="profileCover"><label class="cover-edit">背景変更<input id="coverInput" type="file" accept="image/*" hidden></label></div><div class="profile-main"><label><img id="avatarPreview" src="./icon.png" alt="プロフィール"><input id="avatarInput" type="file" accept="image/*" hidden></label><h2>プロフィール</h2></div><div class="card form-card"><label>あなたの表示名<input id="displayName" placeholder="例：○○" maxlength="20"></label><label>ひとこと<input id="bio" maxlength="60" placeholder="ひとこと"></label><label>記念日<input id="startDate" type="date"></label><label>テーマカラー<input id="themeColor" type="color" value="#ff7fa8"></label><label>フォント・書体<select id="fontStyle"><option value="rounded">まるくて可愛い</option><option value="hand">手書き風</option><option value="gothic">すっきりゴシック</option><option value="serif">上品な明朝</option></select></label><label>カレンダー背景<input id="calendarBg" type="file" accept="image/*"></label><button id="saveProfile">プロフィールを保存</button></div><div class="card share-card"><h3>ふたりで共有</h3><p id="shareStatus">端末内モード</p><button id="createInvite">招待コードを作る</button><div class="join-row"><input id="inviteCode" maxlength="8" placeholder="招待コード"><button id="joinInvite">参加</button></div><small>共有には config.js と Supabase の設定が必要です。</small></div></section></main>
<nav class="bottom-nav"><button data-page="home" class="active"><span>⌂</span>ホーム</button><button data-page="calendar"><span>▣</span>カレンダー</button><button data-page="add" class="add-tab"><span>＋</span>追加</button><button data-page="album"><span>▧</span>アルバム</button><button data-page="profile"><span>○</span>プロフィール</button></nav><dialog id="photoDialog"><button id="closeDialog">×</button><img id="dialogImage"><h3 id="dialogTitle"></h3><p id="dialogNote"></p><button id="deletePhoto" class="danger">削除</button></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./script.js"></script></body></html>
