<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memoria</title>

  ./icon.png
  ./icon.png

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memoria">

  <style>

:root{
  --main:#ff80ab;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:sans-serif;
}

body{
  background:#f5f5f5;
}

.page{
  display:none;
  padding:20px;
  padding-bottom:90px;
}

.page.active{
  display:block;
}

header{
  text-align:center;
  padding:20px;
  color:white;
  background:var(--main);
}

.card{
  background:white;
  margin-top:15px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.gallery{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.gallery img{
  width:100%;
  border-radius:10px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 10px rgba(0,0,0,.15);
}

.bottom-nav button{
  border:none;
  background:none;
  font-size:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.bottom-nav span{
  font-size:24px;
}

input,button{
  padding:10px;
  margin-top:10px;
  width:100%;
}

.profile-img{
  width:100px;
  height:100px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:auto;
}
</style>
</head>

<body>

<header>
  <h1>❤️ Memoria</h1>
</header>

<!-- ホーム -->
<div id="home" class="page active">
  <div class="card">
    <h2>今日の思い出</h2>
    <p>彼女との思い出を残そう📸</p>
  </div>

  <div class="card">
    <h2>付き合って</h2>
    <p id="days">設定してね</p>
  </div>
</div>

<!-- アルバム -->
<div id="album" class="page">
  <div class="card">
    <h2>アルバム</h2>

    <input type="file" id="photoInput">

    <div class="gallery" id="gallery"></div>
  </div>
</div>

<!-- 写真追加 -->
<div id="upload" class="page">
  <div class="card">
    <h2>写真を追加</h2>

    <input type="file" id="newPhoto">

    <button onclick="savePhoto()">
      保存
    </button>
  </div>
</div>

<!-- カレンダー -->
<div id="calendar" class="page">
  <div class="card">
    <h2>予定登録</h2>

    <input type="date" id="eventDate">
    <input type="text" id="eventText" placeholder="デート予定">

    <button onclick="addEvent()">
      登録
    </button>

    <ul id="eventList"></ul>
  </div>
</div>

<!-- プロフィール -->
<div id="profile" class="page">
  <div class="card">

    <h2>プロフィール</h2>

    https://via.placeholder.com/150

    <input type="file" id="profileImage">

    <input
      type="date"
      id="startDate"
    >

    <input
      type="color"
      id="themeColor"
    >

  </div>
</div>

<nav class="bottom-nav">

<button onclick="showPage('home')">
<span>🏠</span>
ホーム
</button>

<button onclick="showPage('album')">
<span>🖼️</span>
アルバム
</button>

<button onclick="showPage('upload')">
<span>➕</span>
追加
</button>

<button onclick="showPage('calendar')">
<span>📅</span>
カレンダー
</button>

<button onclick="showPage('profile')">
<span>👤</span>
プロフィール
</button>

</nav>

<script>
function showPage(page){

document.querySelectorAll('.page')
.forEach(p=>p.classList.remove('active'));

document.getElementById(page)
.classList.add('active');

}

const gallery =
document.getElementById('gallery');

function renderGallery(){

gallery.innerHTML='';

const photos =
JSON.parse(localStorage.getItem('photos')||'[]');

photos.forEach(src=>{

const img =
document.createElement('img');

img.src=src;

gallery.appendChild(img);

});

}

function savePhoto(){

const file =
document.getElementById('newPhoto')
.files[0];

if(!file)return;

const reader =
new FileReader();

reader.onload=e=>{

const photos =
JSON.parse(localStorage.getItem('photos')||'[]');

photos.push(e.target.result);

localStorage.setItem(
'photos',
JSON.stringify(photos)
);

renderGallery();

};

reader.readAsDataURL(file);

}

function addEvent(){

const events =
JSON.parse(localStorage.getItem('events')||'[]');

events.push({

date:eventDate.value,
text:eventText.value

});

localStorage.setItem(
'events',
JSON.stringify(events)
);

renderEvents();

}

function renderEvents(){

const ul =
document.getElementById('eventList');

ul.innerHTML='';

const events =
JSON.parse(localStorage.getItem('events')||'[]');

events.forEach(e=>{

const li =
document.createElement('li');

li.textContent =
e.date+" "+e.text;

ul.appendChild(li);

});

}

document
.getElementById('themeColor')
.addEventListener('input',e=>{

document
.documentElement
.style
.setProperty(
'--main',
e.target.value
);

localStorage.setItem(
'themeColor',
e.target.value
);

});

const savedColor =
localStorage.getItem('themeColor');

if(savedColor){

document
.documentElement
.style
.setProperty(
'--main',
savedColor
);

}

renderGallery();
renderEvents();
</script>

</body>
</html>
