<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ff8fa3"><meta name="apple-mobile-web-app-capable" content="yes"><title>Memoria</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=24"></head><body><div id="toast"></div><div id="authScreen" class="auth-screen"><div class="auth-card"><img src="icon.svg" class="auth-logo"><h1>Memoria</h1><p>IDとパスワードで利用できます</p><input id="authUserId" type="text" autocomplete="username" maxlength="24" placeholder="ID（英数字・_・-）"><input id="authPassword" type="password" autocomplete="current-password" minlength="6" placeholder="パスワード（6文字以上）"><button id="loginButton">ログイン</button><button id="signupButton" class="secondary-auth">IDを新規作成</button><p id="authMessage"></p><small class="auth-note">このIDはこの端末のブラウザ内に保存されます。</small></div></div><header id="calendarHeader" class="calendar-header hidden"><button id="prevMonth">‹</button><div><small id="calendarYear"></small><h1 id="calendarMonth"></h1></div><button id="nextMonth">›</button></header><main>
<section id="home" class="page active"><article class="hero"><small>ふたりの記録</small><h1 id="homeName">○○</h1><p id="homeDays">プロフィールで記念日を設定しよう</p></article><div class="quick"><button data-open="calendar">♡<b>カレンダー</b></button><button data-open="add">◇<b>思い出を追加</b></button></div><section class="talks"><div class="section-title"><h2>トーク</h2><button id="friendManagerButton" class="person-plus" aria-label="友だち追加"><svg viewBox="0 0 64 64"><circle cx="24" cy="20" r="10"/><path d="M7 51c1-13 8-19 17-19s16 6 17 19M49 25v18M40 34h18"/></svg><small>友だち追加</small></button></div><div id="homeFriends" class="friend-strip"></div></section><h2>最近の思い出</h2><div id="recentMemories"></div></section>
<section id="calendar" class="page"><div class="calendar-actions"><button id="wishlistButton">♡ やりたいこと</button><button id="anniversaryButton">🎂 記念日</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarGrid" class="calendar-grid"></div><article class="card"><h2 id="selectedDate"></h2><input id="eventTitle" placeholder="予定"><p class="label">予定のマーク</p><div id="emojiPicker" class="emoji-picker"></div><input id="selectedEmoji" type="hidden" value="♡"><button id="saveEvent">この日に保存</button><div id="dayItems"></div></article></section>
<section id="add" class="page"><article class="card"><h1>思い出を追加</h1><div class="photo-pickers"><label>📷<b>その場で撮る</b><input id="cameraInput" type="file" accept="image/*" capture="environment"></label><label>▧<b>写真から複数選ぶ</b><input id="libraryInput" type="file" accept="image/*" multiple></label></div><div id="photoPreviews" class="photo-previews"></div><p id="photoCount">写真は未選択です</p><input id="memoryTitle" placeholder="タイトル"><input id="memoryDate" type="date"><textarea id="memoryNote" placeholder="ひとこと"></textarea><button id="saveMemories">アルバムに保存</button></article></section>
<section id="album" class="page"><h1>アルバム</h1><div id="albumGrid" class="album-grid"></div></section>
<section id="profile" class="page profile-page"><div id="profileCover" class="profile-cover"></div><div class="profile-heading"><label><img id="profileAvatar" src="icon.svg"><input id="avatarInput" type="file" accept="image/*" hidden></label><h1>プロフィール</h1></div><article class="card"><label>表示名<input id="profileName"></label><label>ひとこと<input id="profileBio"></label><label>記念日<input id="anniversaryDate" type="date"></label><label>テーマカラー<input id="themeColor" type="color" value="#ff8fa3"></label><label>アプリ背景カラー<input id="appBackgroundColor" type="color" value="#faf9f8"></label><label>フォント<select id="fontBase"><option value="basic">基本フォント</option><option value="hc-maru">HC丸ゴシック</option><option value="mushin">無心</option><option value="kamolemon">カモレモン＋</option><option value="ud-shin-maru">UD新丸ゴ</option><option value="maru-antique">丸アンチック＋</option><option value="aoto">あおとゴシック</option><option value="ud-shin-go">UD新ゴ</option><option value="suiryu">翠流アトラス</option><option value="nakim">那欽</option><option value="taka-hand">タカハンド</option><option value="pokkuru">ぽっくる</option><option value="pufu-holiday">プフ ホリデー（Webフォント契約時）</option><option value="tbud-mincho">TBUD明朝</option></select></label><label>文字の大きさ<select id="fontSize"><option value="14">小さめ</option><option value="16">標準</option><option value="18">大きめ</option><option value="20">もっと大きく</option></select></label><label>DM背景カラー<input id="dmBackgroundColor" type="color" value="#8daed8"></label><label>プロフィール背景画像<input id="coverInput" type="file" accept="image/*"></label><label>DM背景画像<input id="dmBackgroundInput" type="file" accept="image/*"></label><button id="clearDmBackground" class="secondary">DM背景画像を解除</button><button id="saveProfile">プロフィールを保存</button></article><article class="card"><div class="account-row"><small id="loginEmail"></small><button id="logoutButton" class="secondary">ログアウト</button></div><h2>DMプロフィール</h2><p>あなたのID</p><div class="id-row"><strong id="myFriendId"></strong><button id="copyFriendId">コピー</button></div><button id="profileFriendManager">友だち・申請を管理</button></article><article class="card"><h2>ふたりで共有</h2><p>アルバム・カレンダー・やりたいこと・記念日を共有します。</p><p id="shareStatus">端末内モード</p><button id="createInvite">招待コードを作る</button><input id="inviteCode" placeholder="招待コード"><button id="joinInvite">参加する</button></article></section></main>
<nav><button data-page="home">⌂<small>ホーム</small></button><button data-page="calendar">▣<small>カレンダー</small></button><button data-page="add">＋<small>追加</small></button><button data-page="album">▧<small>アルバム</small></button><button data-page="profile">○<small>プロフィール</small></button></nav>
<div id="friendScreen" class="screen hidden"><header class="screen-header"><button id="closeFriendScreen">‹</button><h2>友だち</h2><span></span></header><div class="screen-body"><article class="card"><h2>IDで友だち追加</h2><div class="inline"><input id="friendIdInput" maxlength="12" placeholder="相手のID"><button id="sendFriendRequest">申請</button></div></article><h2>届いた申請</h2><div id="friendRequests"></div><h2>友だち一覧</h2><div id="friendList"></div></div></div>
<div id="chatScreen" class="screen hidden"><header class="chat-header"><button id="closeChat">‹</button><img id="chatAvatar" src="icon.svg"><div><h2 id="chatName">トーク</h2><small id="chatId"></small></div></header><div id="messages" class="messages"></div><div class="composer"><textarea id="messageInput" maxlength="1000" placeholder="メッセージ"></textarea><button id="sendMessage">➤</button></div></div>
<div id="modal" class="modal hidden"><div class="modal-sheet"><button id="closeModal" class="close">×</button><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js?v=24"
share-room-hotfix.js?v=25script>
</script></body></html>
