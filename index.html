<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#ff7fa8"><meta name="apple-mobile-web-app-capable" content="yes"><title>Memoria</title><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style-v16.css?v=16.0.0"></head><body><div id="toast"></div><header id="calHead" class="hidden"><button id="prev">‹</button><div><small id="year"></small><h1 id="month"></h1></div><button id="next">›</button></header><main>
<section id="home" class="page active"><div class="hero"><small>ふたりの記録</small><h2 id="names">○○</h2><p id="days">プロフィールで記念日を設定しよう</p></div><div class="quick"><button data-go="calendar">♡<b>カレンダー</b></button><button data-go="add">◇<b>思い出を追加</b></button></div><section class="friends-home"><div class="friends-title"><h3>トーク</h3><button id="openFriendManager" class="add-friend-icon" type="button" aria-label="友だち追加"><span class="person-add-svg" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="25" cy="20" r="10"></circle><path d="M7 50c1-12 8-18 18-18s17 6 18 18"></path><path d="M49 25v18M40 34h18"></path></svg></span><span class="add-friend-label">友だち追加</span></button></div><div id="homeFriends" class="home-friends"></div></section><h3>最近の思い出</h3><div id="recent"></div></section>
<section id="calendar" class="page"><div class="calActions"><button id="openWish">♡ やりたいこと</button><button id="openAnniv">🎂 記念日</button></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="cal"></div><div class="card"><h3 id="picked"></h3><input id="eventText" placeholder="予定"><div class="stamp-area"><p>スタンプを選択</p><div id="stampPicker" class="stamp-picker"></div><input id="selectedStamp" type="hidden" value="♡"></div><button id="saveEvent">この日に保存</button><div id="dayList"></div></div></section>
<section id="add" class="page"><div class="card"><h2>思い出を追加</h2><div class="pickers"><label>📷<b>その場で撮る</b><input id="camera" type="file" accept="image/*" capture="environment"></label><label>▧<b>写真から複数選ぶ</b><input id="library" type="file" accept="image/*" multiple></label></div><div id="previews" class="hidden"></div><p id="count">写真は未選択です</p><input id="title" placeholder="タイトル"><input id="photoDate" type="date"><textarea id="note" placeholder="ひとこと"></textarea><button id="savePhotos">アルバムに保存</button></div></section>
<section id="album" class="page"><h2>アルバム</h2><div id="albumGrid" class="grid"></div></section>
<section id="profile" class="page"><div id="cover"></div><div class="profileTop"><label><img id="avatar" src="icon.png"><input id="avatarInput" type="file" accept="image/*" hidden></label><h2>プロフィール</h2></div><div class="card"><label>あなたの表示名<input id="displayName" placeholder="例：○○"></label><label>ひとこと<input id="bio"></label><label>記念日<input id="startDate" type="date"></label><label>テーマカラー<input id="color" type="color" value="#ff7fa8"></label><label>背景カラー<input id="backgroundColor" type="color" value="#faf9f8"></label><label>フォント<select id="font"><option value="round">まるくて可愛い</option><option value="hand">手書き風</option><option value="gothic">ゴシック</option><option value="serif">明朝</option></select></label><label>文字の大きさ<select id="size"><option value="14">小さめ</option><option value="16">標準</option><option value="18">大きめ</option><option value="20">もっと大きく</option></select></label><label>背景<input id="coverInput" type="file" accept="image/*"></label><label>DM背景カラー<input id="dmBackgroundColor" type="color" value="#8cabd8"></label><label>DM背景画像<input id="dmBackgroundInput" type="file" accept="image/*"></label><button id="clearDmBackground" type="button" class="sub-button">DM背景画像を解除</button><button id="saveProfile">保存</button></div><div class="card friend-id-card"><h3>DMプロフィール</h3><p>あなたのID</p><div class="my-id-line"><strong id="myFriendId"></strong><button id="copyFriendId" type="button">コピー</button></div><small>このIDを相手に伝えると、友だち申請を受け取れます。</small><button id="profileFriendManager" type="button">友だち・申請を管理</button></div><div class="card"><h3>ふたりで共有</h3><p>アルバム・カレンダー・やりたいこと・記念日を共有します。</p><p id="share">端末内モード</p><button id="makeCode">招待コードを作る</button><input id="code" placeholder="招待コード"><button id="join">参加</button></div></section></main>
<nav><button data-page="home">⌂<small>ホーム</small></button><button data-page="calendar">▣<small>カレンダー</small></button><button data-page="add">＋<small>追加</small></button><button data-page="album">▧<small>アルバム</small></button><button data-page="profile">○<small>プロフィール</small></button></nav>
<div id="friendOverlay" class="full-screen hidden"><header class="line-head"><button id="closeFriendManager">‹</button><h2>友だち</h2><span></span></header><div class="full-content"><div class="friend-search-card"><h3>IDで友だち追加</h3><div class="friend-search-row"><input id="friendIdInput" maxlength="12" placeholder="相手のID"><button id="sendFriendRequest">申請</button></div></div><h3>届いた申請</h3><div id="friendRequests"></div><h3>友だち一覧</h3><div id="friendList"></div></div></div><div id="chatOverlay" class="full-screen hidden"><header class="line-head chat-head"><button id="closeChat">‹</button><img id="chatAvatar" src="icon.png"><div><h2 id="chatName">トーク</h2><small id="chatFriendId"></small></div><span></span></header><div id="chatMessages" class="line-messages"></div><div class="line-composer"><button type="button">＋</button><textarea id="chatInput" maxlength="1000" placeholder="Aa"></textarea><button id="sendChat" type="button">➤</button></div></div><div id="modal" class="overlay hidden"><div class="sheet"><button id="modalClose" class="x">×</button><div id="modalBody"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="script-v15.js?v=15.0.0"></script></body></html>
