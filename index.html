<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff7fa8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Memoria"><title>Memoria</title><link rel="icon" href="./icon.png"><link rel="apple-touch-icon" href="./icon.png"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style-v8.css?v=8.0.0"></head><body>
<div id="toast" class="toast"></div><header class="app-header hidden" id="calendarHeader"><button id="prevMonth">‹</button><div><small id="yearLabel"></small><h1 id="monthLabel">Memoria</h1></div><button id="nextMonth">›</button></header>
<main><section id="home" class="page active"><div class="hero card"><span>ふたりの記録</span><h2 id="coupleTitle">○○</h2><p id="daysTogether">プロフィールで記念日を設定しよう</p></div><div class="quick-grid">
<button data-go="calendar" class="quick card home-action"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M17 10v9M47 10v9M10 24h44M14 15h36a5 5 0 0 1 5 5v31a5 5 0 0 1-5 5H14a5 5 0 0 1-5-5V20a5 5 0 0 1 5-5Z"/><path d="m23 39 6 6 13-15"/></svg><b>カレンダー</b><small>ふたりの予定と思い出</small></button>
<button data-go="add" class="quick card home-action"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M22 18 26 12h12l4 6h8a7 7 0 0 1 7 7v24a7 7 0 0 1-7 7H14a7 7 0 0 1-7-7V25a7 7 0 0 1 7-7h8Z"/><circle cx="32" cy="36" r="11"/><path d="M48 27h.1M32 31v10M27 36h10"/></svg><b>思い出を追加</b><small>写真をかわいく残す</small></button>
</div><h3>最近の思い出</h3><div id="recentGrid" class="photo-grid"></div></section>
<section id="calendar" class="page"><div class="calendar-tools"><button class="outline" id="openWishlist">♡ やりたいこと</button><button class="outline">🎂 記念日</button></div><div class="weekday"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendarGrid" class="calendar-grid"></div><div class="card calendar-form"><h3 id="selectedDateLabel">日付を選択</h3><input id="eventText" placeholder="予定・思い出のタイトル"><input id="eventPhoto" type="file" accept="image/*"><button id="saveEvent">この日に保存</button><div id="selectedDateSummary" class="selected-date-summary"></div></div></section>
<section id="add" class="page"><div class="card form-card"><h2>思い出を追加</h2><div class="source-picker"><label class="source-btn file-source">📷<b>その場で撮る</b><small>カメラを起動</small><input id="cameraInput" type="file" accept="image/*" capture="environment"></label><label class="source-btn file-source">🖼️<b>写真から複数選ぶ</b><small>写真フォルダから複数枚OK</small><input id="libraryInput" type="file" accept="image/*" multiple></label></div><div id="previewSection" class="preview-section hidden"><div class="preview-heading"><b>選択した写真</b><button id="clearSelectedPhotos" type="button">選択解除</button></div><div id="photoPreviewGrid" class="selected-preview-grid"></div></div><label>タイトル<input id="photoTitle" maxlength="40" placeholder="例：水族館デート"></label><label>日付<input id="photoDate" type="date"></label><label>ひとこと<textarea id="photoNote" maxlength="160" placeholder="この日の思い出"></textarea></label><p id="selectedPhotoCount" class="selection-count">写真はまだ選択されていません</p><button id="savePhoto">アルバムに保存</button></div></section>
<section id="album" class="page"><div class="section-head"><h2>アルバム</h2><select id="albumSort"><option value="new">新しい順</option><option value="old">古い順</option></select></div><div id="albumGrid" class="photo-grid"></div></section>
<section id="profile" class="page"><div class="profile-cover" id="profileCover"><label class="cover-edit">背景変更<input id="coverInput" type="file" accept="image/*" hidden></label></div><div class="profile-main"><label class="avatar-editor"><img id="avatarPreview" src="./icon.png" alt="プロフィール"><span>写真を変更</span><input id="avatarInput" type="file" accept="image/*" hidden></label><h2>プロフィール</h2></div><div class="card form-card"><label>あなたの表示名<input id="displayName" placeholder="例：○○" maxlength="20"></label><label>ひとこと<input id="bio" maxlength="60" placeholder="ひとこと"></label><label>記念日<input id="startDate" type="date"></label><label>テーマカラー<input id="themeColor" type="color" value="#ff7fa8"></label><label>フォント・書体<select id="fontStyle"><option value="rounded">まるくて可愛い</option><option value="hand">手書き風</option><option value="gothic">すっきりゴシック</option><option value="serif">上品な明朝</option></select></label><label>文字の大きさ<select id="fontSize"><option value="small">小さめ</option><option value="medium">標準</option><option value="large">大きめ</option><option value="xlarge">もっと大きく</option></select></label><label>カレンダー背景<input id="calendarBg" type="file" accept="image/*"></label><button id="saveProfile">プロフィールを保存</button></div><div class="card share-card"><h3>ふたりで共有</h3><p id="shareStatus">端末内モード</p><button id="createInvite">招待コードを作る</button><div class="join-row"><input id="inviteCode" maxlength="8" placeholder="招待コード"><button id="joinInvite">参加</button></div><small>共有には config.js と Supabase の設定が必要です。</small></div></section></main>
<nav class="bottom-nav"><button data-page="home" class="active"><span>⌂</span>ホーム</button><button data-page="calendar"><span>▣</span>カレンダー</button><button data-page="add" class="add-tab"><span>＋</span>追加</button><button data-page="album"><span>▧</span>アルバム</button><button data-page="profile"><span>○</span>プロフィール</button></nav><dialog id="wishlistDialog" class="wishlist-dialog"><div class="dialog-title-row"><div><small>ふたりで叶えたい</small><h3>♡ やりたいことリスト</h3></div><button id="closeWishlist" type="button">×</button></div><div class="wishlist-form"><input id="wishlistInput" maxlength="80" placeholder="例：水族館に行く"><button id="saveWishlistItem" type="button">追加</button></div><div id="wishlistItems" class="wishlist-items"></div></dialog><dialog id="eventDetailDialog" class="event-detail-dialog"><div class="dialog-title-row"><div><small id="detailDate"></small><h3>この日の記録</h3></div><button id="closeEventDetail" type="button">×</button></div><div id="eventDetailBody" class="event-detail-body"></div><button id="addToSelectedDate" class="primary-dialog-btn" type="button">この日に予定を追加</button></dialog><dialog id="cropDialog" class="crop-dialog"><h3>アイコンにする範囲を選択</h3><div class="crop-stage"><img id="cropImage" alt="切り抜きプレビュー"></div><label>拡大<input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"></label><label>左右<input id="cropX" type="range" min="0" max="100" value="50"></label><label>上下<input id="cropY" type="range" min="0" max="100" value="50"></label><div class="crop-actions"><button id="cancelCrop" type="button">キャンセル</button><button id="applyCrop" type="button">この範囲に決定</button></div></dialog><dialog id="photoDialog"><button id="closeDialog">×</button><img id="dialogImage"><h3 id="dialogTitle"></h3><p id="dialogNote"></p><button id="deletePhoto" class="danger">削除</button></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./script-v8.js?v=8.0.0"></script></body></html>
